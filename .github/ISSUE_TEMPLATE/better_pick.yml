name: Better pick
description: Propose replacing a resource, or filling in a TBD topic
labels: ["better-pick"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic / phase
      placeholder: "Phase 6: LLMs > Evaluation"
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: Current pick (leave blank if the topic is TBD)
      placeholder: "Title of the resource being replaced"
    validations:
      required: false
  - type: input
    id: proposed
    attributes:
      label: Proposed resource
      placeholder: "Title + URL"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this beats the current pick, or why it fills the gap
    validations:
      required: true
