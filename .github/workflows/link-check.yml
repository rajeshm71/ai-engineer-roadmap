name: Link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # YouTube answers 200 for removed and private videos and playlists, so a
      # plain HTTP check passes them. The oEmbed endpoint returns 401 or 404.
      - name: Check YouTube videos and playlists via oEmbed
        run: |
          videos=$(grep -oE 'youtube\.com/watch\?([^ )>"]*&)?v=[A-Za-z0-9_-]{11}' README.md \
            | grep -oE '[A-Za-z0-9_-]{11}$' | sort -u \
            | sed 's#^#https://www.youtube.com/watch?v=#')
          playlists=$(grep -oE 'youtube\.com/playlist\?([^ )>"]*&)?list=[A-Za-z0-9_-]+' README.md \
            | grep -oE '[A-Za-z0-9_-]+$' | sort -u \
            | sed 's#^#https://www.youtube.com/playlist?list=#')
          urls=$(printf '%s\n%s\n' "$videos" "$playlists" | sed '/^$/d')
          if [ -z "$urls" ]; then
            echo "No YouTube video or playlist links found."
            exit 0
          fi
          failed=0
          for url in $urls; do
            # curl retries 408, 429, 5xx and timeouts with exponential backoff.
            code=$(curl -sS -o /dev/null -w '%{http_code}' -G \
              --retry 4 --retry-connrefused --max-time 30 \
              --data-urlencode "url=$url" -d format=json \
              https://www.youtube.com/oembed) || true
            if [ "$code" = "200" ]; then
              echo "OK   $url"
            else
              echo "::error file=README.md::YouTube link unavailable (oEmbed HTTP $code): $url"
              failed=1
            fi
          done
          exit $failed

      # 429 is not accepted: lychee retries it with exponential backoff
      # (5s, 10s, 20s, 40s) and also slows down per host when rate limited.
      - name: Check links in README
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --include-fragments
            --accept 200,206,302
            --max-retries 4
            --retry-wait-time 5
            --host-concurrency 4
            --exclude "oreilly\.com"
            --exclude "reddit\.com"
            --exclude "deeplearning\.ai/the-batch"
            --exclude "genai\.owasp\.org"
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
            README.md
          fail: true

      # The resource index repeats every topic's picks by hand, so fail when
      # it drifts from the topic sections (missing, extra, or reordered picks).
      - name: Check resource index matches topic sections
        if: ${{ !cancelled() }}
        shell: python3 {0}
        run: |
          import re, sys
          text = open("README.md", encoding="utf-8").read()
          body, index = text.split("\n## Resource index\n", 1)
          index = index.split("\n## ", 1)[0]
          link = re.compile(r"\[(.+?)\]\((.+?)\)")

          sections, topic = {}, None
          for line in body.splitlines():
              if line.startswith("### "):
                  topic = line[4:].strip()
                  sections[topic] = []
              m = re.match(r"- \*\*" + link.pattern + r"\*\*", line)
              if m and topic:
                  sections[topic].append(m.groups())
          sections = {t: p for t, p in sections.items() if p}

          rows = {}
          for line in index.splitlines():
              m = re.match(r"\| \[(.+?)\]\(#[^)]+\) \| (.+) \|$", line)
              if m:
                  rows[m.group(1)] = link.findall(m.group(2).replace("\\|", "|"))

          errors = []
          if list(sections) != list(rows):
              errors.append("Topic order or set differs between sections and index.")
          for t in sections.keys() | rows.keys():
              if sections.get(t) != rows.get(t):
                  errors.append(f"Index row for '{t}' does not match its section.")
          for e in errors:
              print(f"::error file=README.md::{e}")
          print(f"Checked {len(sections)} topics.")
          sys.exit(1 if errors else 0)
