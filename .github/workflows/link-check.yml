name: Link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # YouTube answers 200 for removed and private videos and playlists, so a
      # plain HTTP check passes them. The oEmbed endpoint returns 401 or 404.
      - name: Check YouTube videos and playlists via oEmbed
        run: |
          videos=$(grep -oE 'youtube\.com/watch\?([^ )>"]*&)?v=[A-Za-z0-9_-]{11}' README.md \
            | grep -oE '[A-Za-z0-9_-]{11}$' | sort -u \
            | sed 's#^#https://www.youtube.com/watch?v=#')
          playlists=$(grep -oE 'youtube\.com/playlist\?([^ )>"]*&)?list=[A-Za-z0-9_-]+' README.md \
            | grep -oE '[A-Za-z0-9_-]+$' | sort -u \
            | sed 's#^#https://www.youtube.com/playlist?list=#')
          urls=$(printf '%s\n%s\n' "$videos" "$playlists" | sed '/^$/d')
          if [ -z "$urls" ]; then
            echo "No YouTube video or playlist links found."
            exit 0
          fi
          failed=0
          for url in $urls; do
            # curl retries 408, 429, 5xx and timeouts with exponential backoff.
            code=$(curl -sS -o /dev/null -w '%{http_code}' -G \
              --retry 4 --retry-connrefused --max-time 30 \
              --data-urlencode "url=$url" -d format=json \
              https://www.youtube.com/oembed) || true
            if [ "$code" = "200" ]; then
              echo "OK   $url"
            else
              echo "::error file=README.md::YouTube link unavailable (oEmbed HTTP $code): $url"
              failed=1
            fi
          done
          exit $failed

      # 429 is not accepted: lychee retries it with exponential backoff
      # (5s, 10s, 20s, 40s) and also slows down per host when rate limited.
      - name: Check links in README
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --include-fragments
            --accept 200,206,302
            --max-retries 4
            --retry-wait-time 5
            --host-concurrency 4
            --exclude "oreilly\.com"
            --exclude "reddit\.com"
            --exclude "deeplearning\.ai/the-batch"
            --exclude "genai\.owasp\.org"
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
            README.md
          fail: true
